14" fill="#fff" opacity=".5"/></svg>`}
function heroArt(){return `<svg viewBox="0 0 450 340" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-label="서로 기대 웃는 가족의 따뜻한 일러스트"><defs><linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7e4c7"/><stop offset="1" stop-color="#d3e1ce"/></linearGradient></defs><rect width="450" height="340" fill="url(#hbg)"/><circle cx="340" cy="65" r="112" fill="#fff4dc"/><path d="M0 282Q104 224 222 267T450 254V340H0z" fill="#b0cbb1" opacity=".5"/><path d="M61 340c5-117 42-162 108-161s105 45 115 161" fill="#7c9d8c"/><path d="M208 340c2-120 54-166 116-161s92 59 102 161" fill="#d68d76"/><path d="M126 177h57l1 37-24 22-35-24z" fill="#f3bba1"/><path d="M283 178h54v34l-25 20-31-19z" fill="#eeb497"/><ellipse cx="153" cy="120" rx="62" ry="75" fill="#88827a"/><ellipse cx="158" cy="137" rx="51" ry="62" fill="#f4baa2"/><path d="M103 125q-20-88 46-83 71-3 59 84l-15-24c-35 0-47-15-53-28-3 18-20 37-37 51" fill="#aaa49a"/><path d="M128 139q8-5 17 0m30 0q8-5 17 0" stroke="#765447" stroke-width="3" stroke-linecap="round"/><path d="M142 170q16 14 30 0" stroke="#ab6b58" stroke-width="3.3" fill="none" stroke-linecap="round"/><ellipse cx="309" cy="111" rx="59" ry="80" fill="#4b3d39"/><ellipse cx="312" cy="138" rx="50" ry="62" fill="#edb496"/><path d="M259 130q-10-81 57-94c62-2 62 68 43 99-22-11-32-26-40-46-15 29-33 35-60 41" fill="#4b3d39"/><path d="M280 141q8-5 17 0m28 0q8-5 17 0" stroke="#755047" stroke-width="3" stroke-linecap="round"/><path d="M296 172q16 15 31 0" fill="none" stroke="#a96755" stroke-width="3.3" stroke-linecap="round"/><path d="M217 275q16-43 54-49l36 14" stroke="#eeb497" stroke-width="22" stroke-linecap="round" fill="none"/><path d="M273 219q15 8 28 20" stroke="#7a9d84" stroke-width="25" fill="none" stroke-linecap="round"/><path d="M352 185q41 20 54 78" stroke="#b67861" stroke-width="36" stroke-linecap="round" fill="none"/><path d="M42 84q11-9 22 0m-7-11v22" stroke="#fff" opacity=".6" stroke-width="3"/><path d="M379 64q9-7 17 0" stroke="#fff" opacity=".9" stroke-width="3"/></svg>`}
const state={page:(new URLSearchParams(location.search).get('screen')==='parent'?'parent':'home'),recipient:'엄마',name:'어머니',relation:'어머니',consentVoice:false,consentReceive:false,phone:'',record:0,photo:'',template:'안부',input:'엄마, 오늘 비 온대. 외출할 때 우산 꼭 챙겨!',script:'',gen:0,seen:false,reaction:'',modal:''};

const navitems=[['home','home','홈'],['recipient','create','영상 편지 만들기'],['voice','voice','내 목소리·사진'],['inbox','inbox','보낸 편지함'],['parent','parent','부모님 화면']];

function heading(eyebrow,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stepper(){const steps=[['recipient','받는 분'],['voice','목소리·사진'],['compose','메시지 작성'],['review','영상 확인']];const idx=steps.findIndex(x=>x[0]===state.page);return `<div class="stepper">${steps.map((s,i)=>`${i?'<span class="step-line"></span>':''}<span class="step ${i===idx?'current':i<idx?'done':''}"><span class="step-num">${i<idx?'✓':i+1}</span>${s[1]}</span>`).join('')}</div>`}

iv></div>`}
function recipient(){return `${heading('CREATE LETTER','누구에게 마음을 전할까요?','영상 편지를 받을 가족을 선택하고 필요한 동의를 확인해 주세요.')}${stepper()}<div class="flow-card"><h2 class="flow-title">소중한 받는 분을 선택해 주세요</h2><p class="flow-desc">먼저 한 분만 선택할 수 있어요. 나중에 가족을 더 추가할 수 있습니다.</p><div class="recipient-grid">${[['엄마','👩‍🦳','어머니'],['아빠','👨‍🦳','아버지'],['할머니','👵','할머니']].map(r=>`<button class="person-card ${state.recipient===r[0]?'chosen':''}" data-action="recipient" data-value="${r[0]}"><span class="person-emoji">${r[1]}</span><b>${r[0]}</b><small>${r[2]}</small></button>`).join('')}</div><div class="field"><label for="nickname">부모님께 표시할 호칭</label><input class="input" id="nickname" value="${esc(state.name)}" placeholder="예: 우리 엄마"/></div><div class="field"><label for="phone">전화번호 <span style="color:#a8b0a7;font-weight:400">(시안에서는 입력하지 않아도 됩니다)</span></label><input class="input" id="phone" type="tel" inputmode="tel" value="${esc(state.phone)}" placeholder="실제 서비스 연결 전에는 저장하지 않습니다"/></div><div class="divider"></div><div style="font-weight:850;font-size:14px">안전한 영상 편지 사용을 위한 동의</div><label class="consent-row"><input type="checkbox" id="consentVoice" ${state.consentVoice?'checked':''}/><span><strong>[필수]</strong> 내 얼굴·목소리를 AI 영상 편지 제작에 사용하는 데 동의합니다.</span></label><label class="consent-row"><input type="checkbox" id="consentReceive" ${state.consentReceive?'checked':''}/><span><strong>[필수]</strong> 가족에게 영상 수신 안내를 전달할 수 있음을 확인했습니다.<br/><span style="color:#a3aaa1">실서비스에서는 수신 동의 및 본인 확인 절차가 별도로 필요합니다.</span></span></label><div class="note-box" style="margin-top:12px">${ic('shield',15)} 실제 서비스에서는 동의 철회, 데이터 삭제, AI 생성 표시가 제공되어야 합니다. 이 시안은 개인정보를 서버에 전송하지 않습니다.</div><div class="flow-footer"><span class="hint">STEP 01 / 04</span><button class="btn primary" data-action="nextRecipient">다음으로 ${ic('arrow')}</button></div></div>`}
function voice(){return `${heading('VOICE & FACE','목소리와 사진을 준비해 주세요','3분 음성 등록과 얼굴 사진 업로드 과정의 화면 예시입니다.')}${stepper()}<div class="flow-card"><h2 class="flow-title">당신의 목소리를 들려주세요 🎙️</h2><p class="flow-desc">실제 제품에서는 문장별로 녹음하고 소리 품질을 확인합니다. 이 시안에서는 녹음 진행만 시뮬레이션합니다.</p><div class="record-area"><div class="read-panel"><div class="n">읽기 연습 · 문장 1 / 6</div><blockquote>“엄마, 오늘 하늘이 참 맑아.<br/>좋은 하루 보내고, 맛있는 밥도 꼭 챙겨 먹어!”</blockquote><div class="progress"><span style="width:${state.record}%"></span></div><div style="display:flex;justify-content:space-between;font-size:11px;color:#909e91;margin-top:9px"><span>샘플 녹음 진행률</span><strong>${state.record}%</strong></div></div><div class="voicebox"><div class="miccircle">${ic('voice',26)}</div><strong style="font-size:14px">${state.record===100?'녹음 샘플 완료!':state.record>0?'녹음 시뮬레이션 중':'목소리 등록 데모'}</strong><div class="bars">${[10,18,27,16,24,12,29,19,12].map(n=>`<i style="--h:${n}px"></i>`).join('')}</div><button class="btn primary" data-action="record" ${state.record>0&&state.record<100?'disabled':''}>${state.record===100?'다시 연습하기':state.record>0?'진행 중…':'샘플 녹음 시작'}</button><span style="font-size:10px;color:#8c9b8d">마이크 입력·학습은 수행하지 않습니다</span></div></div><div class="section-head" style="margin:27px 0 8px"><h3>얼굴 사진 등록</h3><span class="hint">권장: 정면, 밝은 조명</span></div><label class="upload" for="photoInput">${state.photo?`<img class="upload-preview" src="${state.photo}" alt="선택한 사진 미리보기"/>`:`<div style="width:67px;height:67px;border-radius:15px;background:#e8f0e5;display:grid;place-items:center;color:#578161">${ic('camera',28)}</div>`}<div style="text-align:left"><strong style="display:block;font-size:13px">${state.photo?'사진 미리보기 준비 완료':'사진 선택하기'}</strong><span style="font-size:11px;color:#9fa69d">JPG, PNG · 업로드 없이 브라우저에서만 미리보기</span></div>${ic('upload',18)}</label><input type="file" id="photoInput" accept="image/png,image/jpeg,image/webp" hidden/><div class="flow-footer"><button class="btn lightbtn" data-go="recipient">${ic('back')} 이전</button><span class="hint">STEP 02 / 04</span><button class="btn primary" data-go="compose">다음으로 ${ic('arrow')}</button></div></div>`}
const prompts={안부:'엄마, 오늘 비 온대. 외출할 때 우산 꼭 챙겨!',생일:'엄마, 생신 정말 축하드려요! 오늘은 누구보다 행복한 날 보내요.',건강:'엄마, 요즘 날씨가 쌀쌀해졌어. 따뜻하게 입고 밥 잘 챙겨 먹어.',명절:'엄마, 이번 명절에도 늘 건강하고 행복해요. 곧 찾아뵐게요.',날씨:'엄마, 오늘 오후에 비 소식 있대. 우산 꼭 챙기고 조심히 다녀.'};
function compose(){const display=state.script||state.input;return `${heading('WRITE YOUR HEART','어떤 이야기를 전할까요?','한 줄만 적어도 좋아요. 자연스럽고 따뜻한 메시지로 다듬어 보세요.')}${stepper()}<div class="flow-card"><div class="compose-grid"><div><h2 class="flow-title">오늘의 마음을 적어 보세요</h2><p class="flow-desc" style="margin-bottom:13px">자주 쓰는 주제부터 선택해도 좋아요.</p><div class="templates">${Object.keys(prompts).map(t=>`<button class="template ${state.template===t?'selected':''}" data-action="preset" data-value="${t}">${t==='안부'?'💌':t==='생일'?'🎂':t==='건강'?'🍀':t==='명절'?'🌕':'☂️'} ${t}</button>`).join('')}</div><label style="font-weight:800;font-size:13px;display:block;margin-bottom:9px" for="messageInput">영상 편지 내용</label><div class="text-editor"><textarea id="messageInput" maxlength="220" placeholder="마음을 적어주세요">${esc(display)}</textarea><div class="editor-bottom"><span>너무 길지 않은 15~20초 메시지를 추천해요.</span><span id="charCount">${display.length} / 220</span></div></div><button class="btn softbtn" data-action="polish" style="margin-top:13px">${ic('sparkle')} 대본 다듬기 (데모)</button><div class="note-box" style="margin-top:17px">AI는 대본을 제안하지만, 최종 메시지는 자녀가 직접 확인하고 승인합니다.</div></div><div class="side-preview"><span class="tinychip">${esc(state.name)}에게</span><div class="circle-face">${ladyArt('mother')}</div><div style="font-weight:850;font-size:14px">미리 읽어 보는 편지 💌</div><blockquote id="livePreview">“${esc(display)}”</blockquote><span class="tinychip">AI 음성·영상 예시</span></div></div><div class="flow-footer"><button class="btn lightbtn" data-go="voice">${ic('back')} 이전</button><span class="hint">STEP 03 / 04</span><button class="btn primary" data-action="nextCompose">영상 만들기 ${ic('arrow')}</button></div></div>`}
function review(){const finished=state.gen===100;return `${heading('PREVIEW & APPROVE','영상을 확인하고 마음을 전해요','생성 중 상태와 최종 확인 화면입니다. 영상 재생은 시안용 애니메이션입니다.')}${stepper()}<div class="flow-card"><div class="review-grid"><div class="video-preview">${state.photo?`<img src="${state.photo}" alt="사용자가 선택한 영상용 사진" style="position:absolute;width:100%;height:100%;object-fit:cover"/>`:ladyArt('daughter')}<button class="play-over" data-action="preview" title="미리보기 데모" ${!finished?'disabled':''}>${ic('play',26)}</button><span class="ai-tag">AI로 생성한 영상 · 시안 예시</span></div><div><h2 class="flow-title">${finished?'영상 미리보기가 준비됐어요 💚':'영상 편지를 만드는 중이에요'}</h2><p class="flow-desc" style="margin:7px 0 18px">받는 분: ${esc(state.name)} · 약 15~20초 분량</p><div class="statebox"><div style="display:flex;justify-content:space-between;gap:7px;align-items:center;margin-bottom:11px"><b style="font-size:13px">${state.gen===0?'생성 대기':state.gen<45?'음성 생성 중 (데모)':state.gen<85?'영상 합성 중 (데모)':finished?'시안 미리보기 준비 완료':'인코딩 중 (데모)'}</b><span style="font-size:12px;color:#6e9373;font-weight:800">${state.gen}%</span></div><div class="progress"><span style="width:${state.gen}%"></span></div></div><div class="checklist"><div class="checkitem"><span>${ic('check',15)}</span> 자녀가 확인한 대본</div><div class="checkitem"><span>${ic('check',15)}</span> AI 생성 영상 표시</div><div class="checkitem"><span>${ic('shield',15)}</span> 전송 전 최종 승인</div></div>${state.gen===0?`<button class="btn primary wide" data-action="generate">${ic('sparkle')} 영상 생성 시뮬레이션</button>`:finished?`<button class="btn primary wide" data-action="share">${ic('heart')} 확인하고 발송 준비</button>`:`<button class="btn primary wide" disabled>샘플 생성 중…</button>`}<button class="btn lightbtn wide" data-go="compose" style="margin-top:10px">대본 수정하기</button></div></div><div class="note-box" style="margin-top:23px">실제 음성 합성·GPU 영상 생성·카카오톡 메시지 발송 기능은 구현되지 않은 인터랙티브 디자인 시안입니다.</div></div>`}
function inbox(){return `${heading('MY LETTERS','나의 영상 편지함','만든 편지를 확인하고 부모님이 보는 화면을 미리 살펴보세요.',`<button class="btn primary" data-go="recipient">${ic('create')} 새 영상 편지</button>`)}<div class="inbox-grid">${[['엄마께 보내는 아침 안부','10월 20일 · 샘플 영상','mother','시청 완료 · 예시'],['건강 챙겨요, 엄마','10월 18일 · 샘플 영상','daughter','보관 중 · 예시'],['${esc(state.name)}에게 전하는 마음','지금 작성한 데모 편지','daughter',state.gen===100?'미리보기 완료':'작성 중']].map((r,i)=>`<button class="inbox-card" data-go="${i===2?'review':'parent'}"><div class="inbox-visual">${ladyArt(r[2])}</div><div class="inbox-info"><b>${r[0]}</b><p>${r[1]}</p><span class="status ${i===1?'draft':''}">${r[3]}</span></div></button>`).join('')}</div><div class="note-box" style="margin-top:24px">이 목록은 UI 데모 데이터입니다. 저장된 실제 영상이나 시청 기록은 없습니다.</div>`}
function parent(){return `${heading('PARENT EXPERIENCE','부모님 시청 화면','카카오톡·문자로 받은 링크를 열었을 때 보이는 모바일 화면을 확인해 보세요.')}<div class="parent-layout"><div class="parent-aside"><div class="kicker">FOR FAMILY 💌</div><h2>받는 순간부터<br/>쉽고, 따뜻하게.</h2><p>로그인하지 않아도 바로 시청할 수 있는 화면. 시니어 사용자를 위해 큰 재생 버튼, 읽기 편한 자막, 단순한 반응 버튼을 사용했습니다.</p><div class="parent-feature"><i>▶</i> 소리 있는 영상은 버튼을 눌러 재생</div><div class="parent-feature"><i>🔤</i> 크고 선명한 한국어 자막</div><div class="parent-feature"><i>❤️</i> 어렵지 않은 한 번의 마음 표현</div><div class="sample-ribbon">✨ 오른쪽 휴대폰 화면을 눌러 체험해 보세요</div></div><div class="mock-phone"><div class="phone-inner"><div class="phone-head"><span style="color:#5f866a;font-size:20px;font-weight:850;letter-spacing:-.065em">♥ 곁에.</span><span style="font-size:11px;color:#a9a598">마음이 도착했어요</span></div><div class="phone-body"><div class="phone-sub">💌 지민이가 보낸 특별한 선물</div><h2>엄마, 오늘도 사랑해요</h2><div class="phone-video" id="parentVideo">${state.photo?`<img src="${state.photo}" alt="편지 발신자 사진" style="position:absolute;width:100%;height:100%;object-fit:cover"/>`:ladyArt('daughter')}<span class="ai-marker">AI로 만든 영상</span><button class="mobile-play" data-action="playParent" title="시청 데모">${ic('play',28)}</button><div class="video-caption" id="videoCaption">지민이가 보낸 영상 편지가 도착했어요.</div></div><button class="phone-bigbtn" data-action="playParent">▶ 영상 재생하기</button><p class="reaction-label">${state.seen?'마음에 드셨나요? 반응을 보내주세요.':'영상을 본 후 마음을 전할 수 있어요.'}</p><div class="reaction"><button data-action="react" data-value="❤️" class="${state.reaction==='❤️'?'chosen':''}" aria-label="사랑해요 반응">❤️</button><button data-action="react" data-value="🥰" class="${state.reaction==='🥰'?'chosen':''}" aria-label="고마워요 반응">🥰</button><button data-action="react" data-value="👍" class="${state.reaction==='👍'?'chosen':''}" aria-label="좋아요 반응">👍</button></div><p style="font-size:10px;color:#b0a99e;text-align:center;margin-top:17px">로그인 없이 시청 · 시안 데모 · 실제 영상 아님</p></div></div></div></div>`}
function render(){renderNav();document.getElementById('screen').innerHTML=({home,recipient,voice,compose,review,inbox,parent}[state.page]||home)();document.getElementById('crumb').textContent='HOME / '+({home:'대시보드',recipient:'영상 편지 / 받는 분',voice:'영상 편지 / 목소리·사진',compose:'영상 편지 / 메시지',review:'영상 편지 / 미리보기',inbox:'편지함',parent:'부모님 화면'}[state.page]||'대시보드');const modalEl=document.getElementById('modal');modalEl.innerHTML=state.modal||'';}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4000)}
function modal(title,body,buttons){state.modal=`<div class="modal-shade" data-action="closeOverlay"><div class="modal"><div class="eyebrow">GYEOTE · INTERACTIVE DEMO</div><h3>${title}</h3><p>${body}</p><div class="modal-actions">${buttons}</div></div></div>`;render()}
function startRecording(){clearInterval(recTimer);state.record=4;render();recTimer=setInterval(()=>{state.record=Math.min(100,state.record+12);const el=document.querySelector('.read-panel .progress span');if(el)el.style.width=state.record+'%';const voiceEl=document.querySelector('.read-panel strong');if(voiceEl)voiceEl.textContent=state.record+'%';if(state.record>=100){clearInterval(recTimer);render();toast('샘플 녹음 체험이 완료됐어요. 실제 음성은 녹음되지 않았습니다.')}},380)}
function startGenerating(){clearInterval(genTimer);state.gen=3;render();genTimer=setInterval(()=>{state.gen=Math.min(100,state.gen+11);render();if(state.gen>=100){clearInterval(genTimer);toast('디자인 시안용 영상 미리보기가 준비됐습니다.')}} ,430)}
function handle(action,value){switch(action){case 'help':modal('이 페이지는 디자인 시안입니다','버튼과 화면 이동을 체험할 수 있습니다. 녹음, AI 학습, 영상 생성, 카카오톡 발송, 실제 개인정보 저장은 연결되어 있지 않습니다.',`<button class="btn primary" data-action="closeModal">알겠어요</button>`);break;
case 'closeModal':state.modal='';render();break;
case 'recipient':state.recipient=value;state.name=value==='엄마'?'어머니':value==='아빠'?'아버지':'할머니';render();break;
case 'nextRecipient':state.name=(document.getElementById('nickname')?.value||'').trim()||state.recipient;state.phone=(document.getElementById('phone')?.value||'').trim();state.consentVoice=!!document.getElementById('consentVoice')?.checked;state.consentReceive=!!document.getElementById('consentReceive')?.checked;if(!state.consentVoice||!state.consentReceive){toast('데모 진행을 위해 필수 확인 항목 2개를 체크해 주세요.');return}go('voice');break;
case 'record':startRecording();break;
case 'preset':state.template=value;state.input=prompts[value];state.script='';render();break;
case 'polish':{const el=document.getElementById('messageInput');const raw=(el?.value||'').trim();if(!raw){toast('먼저 메시지를 한 줄 적어주세요.');return}state.input=raw;state.script=raw.includes('비')?'엄마, 오늘 비가 온다더라. 외출할 땐 우산 꼭 챙기고, 길도 조심해. 늘 건강하고 사랑해!':raw.replace(/[.!?]+$/,'')+' 항상 건강하고, 오늘도 행복한 하루 보내요. 사랑해요!';render();toast('예시 문구로 다듬었어요. 실제 AI는 호출하지 않았습니다.');break}
case 'nextCompose':{let raw=(document.getElementById('messageInput')?.value||'').trim();if(!raw){toast('영상 편지에 담을 메시지를 입력해 주세요.');return}state.script=raw;go('review');break}
case 'generate':startGenerating();break;
case 'preview':if(state.gen<100){toast('먼저 영상 생성 데모를 실행해 주세요.');return}modal('영상 미리보기 · 데모',`<div style="max-width:190px;margin:8px auto">${state.photo?`<img src="${state.photo}" style="width:100%;border-radius:13px" alt="선택한 얼굴 사진"/>`:ladyArt('daughter')}</div><strong style="color:#345b45">${esc(state.script||state.input)}</strong><br/><br/>실제 MP4 영상이나 음성이 아닌 정적인 화면 예시입니다.`,`<button class="btn primary" data-action="closeModal">확인했어요</button>`);break;
case 'share':modal('발송 화면 미리보기',`<strong>‘${esc(state.name)}에게 영상 편지가 도착했어요’</strong><br/><br/>실제 서비스에서는 여기서 카카오 공유 또는 문자 전송을 선택합니다. 시안에서는 외부 발송이 일어나지 않습니다.`,`<button class="btn lightbtn" data-action="closeModal">취소</button><button class="btn primary" data-action="shareDemo">부모님 화면 체험 ${ic('arrow')}</button>`);break;
case 'shareDemo':go('parent');toast('부모님 화면으로 이동했어요. 실제 발송은 하지 않았습니다.');break;
case 'quick':state.template=value;state.input=prompts[value]||prompts.안부;state.script='';go('recipient');break;
case 'react':state.reaction=value;render();toast(`반응 ${value}을(를) 선택했어요. 데모 화면에만 반영됩니다.`);break;
case 'playParent':{let el=document.getElementById('videoCaption');if(!el)return;clearInterval(playTimer);state.seen=true;let n=0;const lines=['엄마, 오늘 비가 온다더라.','외출할 땐 우산 꼭 챙기고,','길도 조심해.','늘 건강하고 사랑해!'];const playButton=document.querySelector('.phone-bigbtn');if(playButton)playButton.textContent='▶ 자막 재생 시뮬레이션 중';el.textContent=lines[0];playTimer=setInterval(()=>{n++;if(n>=lines.length){clearInterval(playTimer);render();toast('시청 체험이 완료됐습니다. 실제 동영상은 재생되지 않았습니다.')}else{if(el)el.textContent=lines[n]}},1200);break}
}}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-go],[data-action]');if(!btn)return;const dest=btn.dataset.go;const action=btn.dataset.action;if(dest)go(dest);else if(action==='closeOverlay'&&e.target===btn){state.modal='';render()}else if(action)handle(action,btn.dataset.value)});
document.addEventListener('input',e=>{if(e.target.id==='messageInput'){state.script=e.target.value;const count=document.getElementById('charCount');if(count)count.textContent=e.target.value.length+' / 220';const preview=document.getElementById('livePreview');if(preview)preview.textContent='“'+e.target.value+'”';}});
document.addEventListener('change',e=>{if(e.target.id==='photoInput'){const file=e.target.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('JPG, PNG, WEBP 사진만 선택할 수 있어요.');return}if(file.size>8*1024*1024){toast('8MB 이하의 사진을 선택해 주세요.');return}const reader=new FileReader();reader.onload=()=>{state.photo=String(reader.result);render();toast('사진을 브라우저에서만 미리보기로 표시합니다. 서버에는 업로드되지 않습니다.')};reader.readAsDataURL(file)}});
render();
</script>
</body>
</html>
